spring:
  application:
    name: rc_weixin
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13307}/${MYSQL_DB:notification}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC
    username: ${MYSQL_USER:notify}
    password: ${MYSQL_PASS:notify}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

notification:
  dispatch:
    # 轮询间隔（毫秒）。强时效接入时可调低（§9.8），或走 insert-then-hint（T4.12）
    poll-interval-ms: 500
    # 单轮认领条数。必须 <= 空闲 worker 数，否则自己制造重复认领（D4.5）
    batch-size: 100
    # 租约时长（秒）。启动时断言：必须 > http.total-timeout-ms + 余量（D4.5）
    lease-duration-seconds: 60
  http:
    connect-timeout-ms: 3000
    total-timeout-ms: 15000
  retry:
    default-max-attempts: 10
  api:
    # API Key → caller_id 注册表（T3.2）。演示用静态配置；生产应从密管/配置中心读取。
    # 轮换 Key 时不改 caller_id：幂等域与历史数据不受影响。
    callers:
      dev-key-ads: sys_ads
      dev-key-crm: sys_crm
      dev-key-inventory: sys_inventory
    rate-limit:
      # 令牌桶（T3.5）：桶深容忍脉冲，恒定补充限平均速率
      capacity: 100
      refill-per-second: 20
  backpressure:
    # 队列积压安全水位（T3.6）。worker 200 × 保守周转 ≈ 5 万（§8）
    max-pending: 50000
  url-policy:
    # D10 第一道闸：接入层只查 scheme / 字面量私网 IP / 白名单；解析后 IP 校验在投递层 P6
    require-https: true
    allowed-hosts: []   # 空列表 = 不启用白名单
  crypto:
    # 载荷保护（D10）：headers_enc / body_enc 的 AES-256-GCM 密钥，Base64 的 32 字节。
    # 一把密钥即可：两类数据在投递路径上都要解密，多把密钥不产生访问域隔离（V5 裁剪记录）。
    # 生产必须由环境变量注入（NOTIFY_DATA_KEY）并配合 prod profile
    # （reject-dev-keys=true 会拒绝默认的开发兜底值）。真实项目应接 KMS。
    data-key: ${NOTIFY_DATA_KEY:}
    reject-dev-keys: false
