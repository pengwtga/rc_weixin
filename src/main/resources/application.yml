spring:
  application:
    name: rc_weixin
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:13307}/${MYSQL_DB:notification}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectionTimeZone=UTC
    username: ${MYSQL_USER:notify}
    password: ${MYSQL_PASS:notify}
    hikari:
      maximum-pool-size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

notification:
  dispatch:
    # 轮询间隔（毫秒）。强时效接入时可调低（§9.8），或走 insert-then-hint（T4.12）
    poll-interval-ms: 500
    # 单轮认领条数上限。实际每轮认领 = min(batch-size, 空闲 worker 数)，见 D4.5
    batch-size: 100
    # 租约时长（秒）。启动时断言：必须 > http.total-timeout-ms + 余量（D4.5）
    lease-duration-seconds: 60
    # 投递线程数 = 同时在途的 HTTP 上限。与 batch-size 是两个概念，别混
    worker-pool-size: 32
    # 队列持续为空时的最大轮询间隔（T4.10）。@Scheduled 仍按基础间隔醒来，但不碰 DB
    idle-backoff-max-ms: 2000
    # 单个下游 host 的并发上限（T4.9）：一家供应商变慢不该拖垮其他家
    host-concurrency: 8
    # 抢不到 host 许可时的重排延迟（毫秒）；此时回退 attempt_count，不算一次尝试
    requeue-delay-ms: 200
    # 停机时等待在途投递完成的上限（秒）；超时后交给租约自然回收
    shutdown-await-seconds: 20
  http:
    # connect 与 total 两段（JDK HttpClient 没有独立 read timeout，见 §9.9）
    connect-timeout-ms: 3000
    total-timeout-ms: 15000
  retry:
    default-max-attempts: 10
    # P4 占位退避：固定延迟，只保证状态机闭环。P5 换成指数退避 + 抖动后此项退役
    fixed-delay-seconds: 30
  api:
    # API Key → caller_id 注册表（T3.2）。演示用静态配置；生产应从密管/配置中心读取。
    # 轮换 Key 时不改 caller_id：幂等域与历史数据不受影响。
    callers:
      dev-key-ads: sys_ads
      dev-key-crm: sys_crm
      dev-key-inventory: sys_inventory
    rate-limit:
      # 令牌桶（T3.5）：桶深容忍脉冲，恒定补充限平均速率
      capacity: 100
      refill-per-second: 20
  backpressure:
    # 队列积压安全水位（T3.6）。worker 200 × 保守周转 ≈ 5 万（§8）
    max-pending: 50000
  url-policy:
    # D10 第一道闸：接入层只查 scheme / 字面量私网 IP / 白名单；解析后 IP 校验在投递层 P6
    require-https: true
    allowed-hosts: []   # 空列表 = 不启用白名单
  crypto:
    # 载荷保护（D10）：两把密钥必须互相独立（密钥分离），各为 Base64 的 32 字节。
    # 生产必须由环境变量注入（NOTIFY_BODY_KEY / NOTIFY_FP_KEY）并配合 prod profile
    # （reject-dev-keys=true 会拒绝下面的开发兜底值）。真实项目应接 KMS / 信封加密。
    body-key: ${NOTIFY_BODY_KEY:}
    fingerprint-key: ${NOTIFY_FP_KEY:}
    reject-dev-keys: false
